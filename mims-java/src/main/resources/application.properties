# ==== Machakos Farmers Association MIMS ====

server.port=8080

# ---- Database: H2 file-based (default, no setup required) ----
spring.datasource.url=jdbc:h2:file:./data/mims;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- To use MySQL / PostgreSQL instead ----
# 1. Uncomment the mysql-connector-j dependency in pom.xml
# 2. Comment out the H2 block above and use:
# spring.datasource.url=jdbc:mysql://localhost:3306/mims_machakos?createDatabaseIfNotExist=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=yourpassword
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# spring.jpa.hibernate.ddl-auto=update

spring.thymeleaf.cache=false

# ---- Optional mail delivery for password recovery ----
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
mims.mail.from=${MIMS_MAIL_FROM:}
mims.public-base-url=${MIMS_PUBLIC_BASE_URL:http://localhost:8080}

# ---- Initial administrator (created only when all values are configured) ----
mims.admin.username=${MIMS_ADMIN_USERNAME:}
mims.admin.email=${MIMS_ADMIN_EMAIL:}
mims.admin.password=${MIMS_ADMIN_PASSWORD:}
