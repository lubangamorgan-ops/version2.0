<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password — MIMS</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-mark">MF</div>
      <div><div class="brand-name">Reset password</div><div class="brand-sub">Choose a new password</div></div>
    </div>

    <p class="form-message form-error" th:if="${error}" th:text="${error}"></p>

    <form th:action="@{/reset-password}" method="post">
      <input type="hidden" name="token" th:value="${token}">
      <label for="password">New password</label>
      <div class="password-field">
        <input id="password" type="password" name="password" minlength="8" maxlength="72" autocomplete="new-password" required>
        <button class="password-toggle" type="button" data-toggle-password="password" aria-label="Show password" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <label for="confirm-password">Confirm new password</label>
      <div class="password-field">
        <input id="confirm-password" type="password" name="confirmPassword" minlength="8" maxlength="72" autocomplete="new-password" required>
        <button class="password-toggle" type="button" data-toggle-password="confirm-password" aria-label="Show password" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <button class="btn btn-primary auth-submit" type="submit">Update password</button>
    </form>

    <a class="auth-back" href="/login">&larr; Back to sign in</a>
  </div>
</div>
<script>
  document.querySelectorAll("[data-toggle-password]").forEach((button) => {
    button.addEventListener("click", () => {
      const input = document.getElementById(button.dataset.togglePassword);
      const visible = input.type === "password";
      input.type = visible ? "text" : "password";
      button.setAttribute("aria-label", visible ? "Hide password" : "Show password");
      button.setAttribute("aria-pressed", String(visible));
    });
  });
</script>
</body>
</html>
