<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search results — MIMS</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="shell">
  <div th:replace="~{fragments/farmer-nav :: nav('lookup')}"></div>
  <div class="main">
    <div class="page-head">
      <h2>Search results</h2>
      <p>Most recent 25 matching price records.</p>
    </div>

    <div class="card">
      <form th:action="@{/farmer/lookup}" method="get" class="grid-2">
        <div><label>Crop</label>
          <select name="cropId" onchange="this.form.submit()">
            <option value="">All crops</option>
            <option th:each="c : ${crops}" th:value="${c.id}" th:selected="${c.id == selectedCropId}" th:text="${c.name}">Crop</option>
          </select>
        </div>
        <div><label>Market</label>
          <select name="marketId" onchange="this.form.submit()">
            <option value="">All markets</option>
            <option th:each="m : ${markets}" th:value="${m.id}" th:selected="${m.id == selectedMarketId}" th:text="${m.name}">Market</option>
          </select>
        </div>
      </form>
      <table style="margin-top:14px;">
        <thead><tr><th>Date</th><th>Crop</th><th>Market</th><th>Price</th></tr></thead>
        <tbody>
          <tr class="empty-row" th:if="${#lists.isEmpty(results)}"><td colspan="4">No matching records.</td></tr>
          <tr th:each="p : ${results}">
            <td th:text="${#temporals.format(p.priceDate, 'dd MMM yyyy')}">date</td>
            <td th:text="${p.crop.name}">Crop</td>
            <td th:text="${p.market.name}">Market</td>
            <td class="price-cell" th:text="'Ksh ' + ${#numbers.formatDecimal(p.price,0,'COMMA',2,'POINT')} + ' / ' + ${p.crop.unit}">price</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
