<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password — MIMS</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-mark">MF</div>
      <div><div class="brand-name">Forgot password?</div><div class="brand-sub">Password recovery</div></div>
    </div>

    <p class="form-message form-error" th:if="${error}" th:text="${error}"></p>
    <p class="form-message form-success" th:if="${success}" th:text="${success}"></p>
    <p class="auth-note">Enter the email address on your account. If it matches an account, we’ll send a reset link that expires in 30 minutes.</p>

    <form th:action="@{/forgot-password}" method="post">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" maxlength="254" autocomplete="email" required>
      <button class="btn btn-primary auth-submit" type="submit">Send reset link</button>
    </form>

    <a class="auth-back" href="/login">&larr; Back to sign in</a>
  </div>
</div>
</body>
</html>
